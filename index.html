<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Keyhold Admin · Nexus Tech Labs</title>
    <link rel="icon" href="assets/favicon.png" />
    <link rel="stylesheet" href="css/styles.css" />
    <script>
      // Apply a saved theme before first paint to avoid a light/dark flash.
      try { var t = localStorage.getItem("keyhold:theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Keyhold Admin needs JavaScript to run.</noscript>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
